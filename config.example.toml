# Copy to config.toml and edit. Secrets are NOT in this file — they come
# from environment variables:
#   MUSE_PROXY_BEARER_TOKEN   the bearer token Bert authenticates with
#   MUSE_CODER_TOKEN          a Coder session token for the proxy's own use

listen_addr = "100.99.196.68"
port = 8090

coder_url = "http://127.0.0.1:7080"

# Only these workspace names may be listed or exec'd into.
workspace_allowlist = ["test-junkyard"]

# Belt-and-braces: reject requests whose source IP falls outside this range,
# even though the server should only ever be reachable via the tailnet
# interface above. Tailscale's CGNAT range by default.
trusted_cidr = "100.64.0.0/10"

audit_log_path = "audit.log"

default_timeout_secs = 300
max_timeout_secs = 600

# Per-stream (stdout/stderr) cap in bytes on captured exec output.
max_output_bytes = 65536
